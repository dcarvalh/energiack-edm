# Checks every pull request, and deploys the database stack to the team's server after a merge into main.
#   check: the database stack from an empty database (tools/check_stack.sh), then the upgrade of a database created by
#          the base branch (tools/check_upgrade.sh): the server keeps its database between deploys.
#   page:  the app in a headless browser (tools/check_page.py: JS errors, FR/EN keys, phone width), on the static site
#          and logged in as administrator on the stack (every view), and what each role sees (tools/check_roles.py).
# The deploy job is skipped until the repository variable DEPLOY_HOST is set (Settings › Secrets and variables › Actions).
# Setup: docs/deploy.md
name: Stack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                       # the upgrade check needs the base branch's files
      - name: Self-test of the quality checks
        run: python3 tools/rc_quality.py --selftest
      - name: Start the stack, compare data.json with the static build, re-import, login
        run: tools/check_stack.sh
      - name: Upgrade a database created by the base branch, nothing lost
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: tools/check_upgrade.sh "$BASE"

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install the headless browser
        run: |
          pip install -q "$(grep '^playwright==' requirements.txt | cut -d' ' -f1)"
          playwright install --with-deps chromium
      - name: Static site (as on GitHub Pages)
        run: |
          python3 -m http.server 8000 -d prototype >/dev/null 2>&1 &
          sleep 1
          python3 tools/check_page.py http://127.0.0.1:8000/ shots/static
      - name: Server version, what each role sees and every page as administrator
        run: |
          tools/check_stack.sh --keep
          python3 tools/check_roles.py http://127.0.0.1:18088/
          CHECK_ROLE=admin python3 tools/check_page.py http://127.0.0.1:18088/ shots/server
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots, if-no-files-found: ignore, retention-days: 7 }

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    concurrency: { group: deploy, cancel-in-progress: false }
    environment: production
    steps:
      - name: Deploy over SSH (git pull + docker compose up)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DIR: ${{ vars.DEPLOY_DIR || 'openedm' }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$USER@$HOST" "set -e; cd '$DIR'; git fetch -q origin main; git checkout -q --detach '$SHA';
            docker compose up -d --build --wait --remove-orphans; docker image prune -f >/dev/null; docker compose ps"
