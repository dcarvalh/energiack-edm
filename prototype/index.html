*{box-sizing:border-box}

main{width:100%;max-width:1440px;padding:24px 24px 48px}

table{width:100%;border-collapse:collapse;font-size:13.5px}

.p-fossil{background:var(--bad-soft);color:var(--bad)}

.p-warn{background:var(--warn-soft);color:var(--warn)}
.qc{border-top:1px solid var(--line)} .qc summary{display:flex;align-items:center;gap:10px;padding:10px 2px;cursor:pointer;list-style:none}

.qc .d{font-size:13px;color:var(--muted);margin:0 0 10px} .qc .tablewrap{margin-bottom:12px} .qc td{padding:8px 10px} .qc tbody tr{cursor:pointer}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;min-width:220px;font-size:13px}

.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
#v-localites .card{min-width:0}                    /* a grid item: lets the table scroll inside the card on a phone */
.tablewrap.scroll{max-height:560px;overflow-y:auto;border-top:1px solid var(--line)}

.count{font-size:12px;color:var(--muted);margin-top:10px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:31;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;border-left:1px solid var(--line)}
.drawer.open{transform:none}
.drawer .in{padding:20px}
.modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:16px;background:rgba(10,12,14,.45)}

.field{display:block;margin:10px 0 0;font-size:12.5px;color:var(--muted);font-weight:550}

.urole{width:auto;margin:0;padding:4px 8px;font-size:13px}
.btn{border:1px solid var(--text);background:var(--text);color:var(--bg);border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.err{color:var(--bad);font-size:12.5px;min-height:1.2em;margin:8px 0}
.demo-roles{display:grid;gap:8px;margin-top:4px}

.demo-roles button:hover{border-color:var(--muted)}
.demo-roles b{display:block;font-size:13.5px;font-weight:600} .demo-roles span{font-size:12.5px;color:var(--muted)}
.acct{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)} .acct b{color:var(--text);font-weight:600}
.acct .chip{display:inline-flex;align-items:center;gap:6px}
.x{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:18px;line-height:1;color:var(--text)}
.fs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px} .fs-grid .wide{grid-column:1/-1}
.fs-lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

.fs-scale{position:relative;height:8px;border-radius:4px;margin:16px 0 4px;background:linear-gradient(90deg,var(--accent) 0 45%,var(--warn) 45% 80%,var(--bad) 80%)}
.fs-scale i{position:absolute;top:-5px;width:4px;height:18px;border-radius:2px;background:var(--text);outline:2px solid var(--surface);transform:translateX(-2px)}
.fs-ticks{position:relative;height:14px;font-size:11px;color:var(--muted)} .fs-ticks span{position:absolute;transform:translateX(-50%)}
.fs-solar{display:flex;gap:20px;flex-wrap:wrap} .fs-solar>div{display:flex;gap:12px;align-items:center;flex:1;min-width:220px} .fs-solar svg{width:76px;height:76px;flex:none}
.fs-leg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:6px 0 2px} .fs-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.fs-rows>div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px} .fs-rows>div:first-child{border-top:0}
.m3-acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px} .m3-acts a{text-decoration:none;display:inline-block} .btn.alt{background:var(--surface);color:var(--text)}
@media(max-width:640px){.fs-grid{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}

.timeline{list-style:none;padding:0;margin:0}
.timeline li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.timeline li:last-child{border:0}
.timeline .d{color:var(--muted);min-width:78px;font-variant-numeric:tabular-nums}
.eq{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:10px 12px;border-radius:10px;overflow-x:auto}
/* citizen */
.hero{font-size:clamp(22px,2.8vw,30px);line-height:1.3;letter-spacing:-.02em;font-weight:600;max-width:24ch;margin:6px 0 24px}

.goals{grid-template-columns:repeat(3,minmax(0,1fr))}
.goal .big{font-size:30px;font-weight:620;letter-spacing:-.03em}

.m3-search{position:relative;margin-bottom:10px}

.m3-results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:5;max-height:260px;overflow:auto;padding:4px}

.m3-btn+.m3-btn{border-top:1px solid var(--line)} .m3-btn:hover{background:var(--surface-2)} .m3-btn.on{background:var(--text);color:var(--bg)}

.m3-panel{position:absolute;top:12px;right:12px;bottom:40px;width:340px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.m3-sec{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.m3-h{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-bottom:6px}

.m3-src{font-size:11.5px;color:var(--muted);margin-top:12px}

<body>
<div class="app">
<aside class="side" id="side">

</div>

<main>
  <!-- ================= WELCOME ================= -->

/* ---------------------------------------------------------------- data */
let D, R = null, M = {};      // data, AI report, computed metrics
const YEARS = [2021,2022,2023,2024,2025];
let YEAR = 2025, FILTER = "all", SORT = {k:"co2", dir:-1}, QUERY = "";

function carrierAt(sid, m){ let c = D.heating_history[sid][0].carrier; for (const h of D.heating_history[sid]) if (m >= h.from_month) c = h.carrier; return c; }
const isFossil = (c) => D.meta.fossil_carriers.includes(c);

function compute(){
  // per site, per month: grid, heat (+carrier), co2, cost
  const sites = {}, years = {};
  for (const y of YEARS) years[y] = {energy:0, cost:0, co2:0, elec:0, hf:0, hr:0, pv:0, pvself:0, water:0, fossilSites:0, monthly:Array.from({length:12},()=>({elec:0,hf:0,hr:0}))};
  for (const s of D.sites){
    const S = D.series[s.id]; const per = {};
    for (const y of YEARS) per[y] = {energy:0, co2:0, cost:0, heat:0, elec:0, pv:0, pvself:0, water:0};
    for (let m=0; m<D.meta.months; m++){
      const y = YEARS[Math.floor(m/12)], mo = m%12, c = carrierAt(s.id, m);
      const g = S.elec_grid[m], h = S.heat[m], pv = S.pv_prod ? S.pv_prod[m] : 0, inj = S.pv_inject ? S.pv_inject[m] : 0;
      const co2 = S.co2[m], cost = S.cost[m];
      const P = per[y]; P.energy += g+h; P.co2 += co2; P.cost += cost; P.heat += h; P.elec += g; P.pv += pv; P.pvself += pv-inj; P.water += S.water[m];
      const Y = years[y]; Y.energy += g+h; Y.co2 += co2; Y.cost += cost; Y.elec += g; Y.pv += pv; Y.pvself += pv-inj; Y.water += S.water[m];
      Y.monthly[mo].elec += g;
      if (isFossil(c)) { Y.hf += h; Y.monthly[mo].hf += h; } else { Y.hr += h; Y.monthly[mo].hr += h; }
    }
    for (const y of YEARS){
      if (isFossil(carrierAt(s.id, (y-2021)*12+11))) years[y].fossilSites++;
      per[y].int = s.area_m2 ? per[y].energy / s.area_m2 : null;
      // approximate heat index, MJ/m² per year: (heat purchased + heat from the heat pump) / SRE. Not weather-corrected.
      const hp = S.heat_hp ? S.heat_hp.slice((y-2021)*12, (y-2020)*12).reduce((a,b)=>a+b, 0) : 0, ht = per[y].heat + hp;
      per[y].hi = s.area_m2 && ht > 0 ? ht * 3.6 / s.area_m2 : null;
      per[y].hiEst = hp > 0 && s.heat_hp === "estimated";
    }
    sites[s.id] = per;
  }
  M = {sites, years};
}
const hiClass = (v) => v >= 800 ? "p-fossil" : v >= 450 ? "p-warn" : "p-ren";   // same classes as the Geneva map (450 and 800 MJ/m²)
function alertsFor(sid, y){
  const out = [];
  for (const e of D.events) if (e.site === sid && (e.kind === "anomaly" || e.kind === "quality") && (e.months || [e.month]).some(m => Math.floor(m/12) === y-2021)) out.push(e);
  return out;
}

/* ---------------------------------------------------------------- charts (plain SVG) */
const tip = document.getElementById("tip");
function showTip(ev, html){ tip.innerHTML = html; tip.style.opacity = 1; const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, yy = ev.clientY - h - 10; if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (yy < 8) yy = ev.clientY + 16; tip.style.left = x+"px"; tip.style.top = yy+"px"; }
function hideTip(){ tip.style.opacity = 0; }
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v||1))); for (const k of [1,1.5,2,2.5,3,4,5,6,8,10]) if (k*p >= v) return k*p; return 10*p; }
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const widthOf = (el) => Math.max(300, Math.round(el.clientWidth || el.parentElement.clientWidth || 640));
function barStack(el, labels, series, fmt){
  const W = widthOf(el), H = 240, L = 40, B = 24, Tp = 8, n = labels.length, bw = (W-L)/n;
  const tot = labels.map((_,i)=>series.reduce((a,s)=>a+s.values[i],0)); const max = niceMax(Math.max(...tot));
  let g = "";
  for (let k=0;k<=4;k++){ const yv = max*k/4, y = H-B-(H-B-Tp)*k/4; g += `<line class="gridl" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${nf(yv/1000)}</text>`; }
  labels.forEach((lab,i)=>{
    let y0 = H-B; const x = L + i*bw + bw*0.18, w = bw*0.64;
    series.forEach((s,j)=>{ const h = (H-B-Tp)*s.values[i]/max; if (h<=0) return; y0 -= h; g += `<rect x="${x}" y="${y0}" width="${w}" height="${h}" fill="${css(s.color)}" ${j===series.length-1?'rx="3"':''}/>`; });
    g += `<rect class="hit" data-i="${i}" x="${L+i*bw}" y="${Tp}" width="${bw}" height="${H-B-Tp}" fill="transparent"/>`;
    if (bw >= 34 || i % 2 === 0) g += `<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
  el.querySelectorAll(".hit").forEach(r => { const i = +r.dataset.i;
    r.addEventListener("mousemove", ev => showTip(ev, `<b>${esc(labels[i])}</b><br>` + series.map(s=>`${esc(s.name)}${t("colon")}${fmt(s.values[i])}`).join("<br>") + `<br><b>Total${t("colon")}${fmt(tot[i])}</b>`));
    r.addEventListener("mouseleave", hideTip); });
}
function lineChart(el, labels, series, fmt, opts={}){
  const W = widthOf(el), H = opts.h || 240, L = 44, B = 24, Tp = 10, n = labels.length;
  const all = series.flatMap(s=>s.values.filter(v=>v!=null)); const max = niceMax(Math.max(...all)*1.05);
  const X = (i) => L + (W-L-10) * (n===1?0.5:i/(n-1)), Y = (v) => H-B-(H-B-Tp)*v/max;
  let g = "";
  for (let k=0;k<=4;k++){ const yv = max*k/4; g += `<line class="gridl" x1="${L}" x2="${W}" y1="${Y(yv)}" y2="${Y(yv)}"/><text x="${L-6}" y="${Y(yv)+4}" text-anchor="end">${opts.ytick?opts.ytick(yv):nf(yv)}</text>`; }
  const step = opts.labelStep || 1;
  labels.forEach((lab,i)=>{ if (i%step===0) g += `<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`; });
  for (const s of series){
    const pts = s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
    g += `<path d="${d}" fill="none" stroke="${css(s.color)}" stroke-width="${s.width||2.2}" ${s.dash?'stroke-dasharray="5 5"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.dots) pts.forEach(p=> g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${css(s.color)}"/>`);
  }
  if (opts.markers) for (const mk of opts.markers) g += `<line x1="${X(mk.i)}" x2="${X(mk.i)}" y1="${Tp}" y2="${H-B}" stroke="${css(mk.color||"--muted")}" stroke-dasharray="2 4" opacity=".7"/>`;
  const bw = (W-L-10)/Math.max(n-1,1);
  labels.forEach((lab,i)=> g += `<rect class="hit" data-i="${i}" x="${X(i)-bw/2}" y="${Tp}" width="${bw}" height="${H-B-Tp}" fill="transparent"/>`);
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
  el.querySelectorAll(".hit").forEach(r => { const i = +r.dataset.i;
    r.addEventListener("mousemove", ev => showTip(ev, `<b>${esc(opts.tipLabel?opts.tipLabel(i):labels[i])}</b><br>` + series.filter(s=>s.values[i]!=null).map(s=>`${esc(s.name)}${t("colon")}${fmt(s.values[i])}`).join("<br>")));
    r.addEventListener("mouseleave", hideTip); });
}
const legend = (el, items) => el.innerHTML = items.map(([n,c,dash])=>`<span><i style="background:${dash?'transparent':css(c)};${dash?`border:2px dashed ${css(c)};width:12px;height:2px;border-radius:0;vertical-align:3px;border-width:2px 0 0 0`:''}"></i>${esc(n)}</span>`).join("");

function deltaHtml(cur, ref, label, goodIfDown=true){
  if (!ref) return "";
  const d = cur/ref - 1, good = goodIfDown ? d < 0 : d > 0;
  return `<div class="delta ${Math.abs(d)<0.005?'mut':good?'good':'badc'}">${pct(d,1)} <span class="mut" style="font-weight:500">${esc(label)}</span></div>`;
}
function noDataBanner(){
  const name = LOC?.name || "";
  return `<div class="card" style="margin-top:14px;text-align:center;padding:2.5rem">

function renderManager(){
  const banner = document.getElementById("no-data-banner");
  if (D?.meta?.no_data) {
    // Show banner, hide existing content — never destroy the DOM structure
    if (!banner) {
      const el = document.createElement("div");
      el.id = "no-data-banner";
      el.innerHTML = noDataBanner();
      document.getElementById("v-gestion").prepend(el);
    }
    // Hide all section content except the banner
    Array.from(document.getElementById("v-gestion").children)
      .forEach(c => { if (c.id !== "no-data-banner") c.style.display = "none"; });
    return;
  }
  // Data now available — remove banner and restore visibility
  if (banner) {
    banner.remove();
    Array.from(document.getElementById("v-gestion").children)
      .forEach(c => c.style.removeProperty("display"));
  }
  const Y = M.years[YEAR], P = M.years[YEAR-1], B0 = M.years[D.meta.baseline_year];
  document.getElementById("years").innerHTML = YEARS.map(y=>`<button data-y="${y}" class="${y===YEAR?'on':''}">${y}</button>`).join("");
  const k = [
    [t("k_energy"), nf(Y.energy/1e6,2), "GWh", P?deltaHtml(Y.energy,P.energy,t("vs_prev",{y:YEAR-1})):""],
    [t("k_cost"), nf(Y.cost/1e6,2), "M CHF", P?deltaHtml(Y.cost,P.cost,t("vs_prev",{y:YEAR-1})):""],
    [t("k_co2"), nf(Y.co2/1000), "t", YEAR!==D.meta.baseline_year?deltaHtml(Y.co2,B0.co2,t("vs_base",{y:D.meta.baseline_year})):""],
    [t("k_fossil"), nf(Y.fossilSites), t("of_sites",{n:D.sites.length}), P&&P.fossilSites!==Y.fossilSites?`<div class="delta good">${Y.fossilSites-P.fossilSites} <span class="mut" style="font-weight:500">${esc(t("vs_prev",{y:YEAR-1}))}</span></div>`:""],
    [t("k_solar"), nf(Y.pv/1000), "MWh", `<div class="delta mut">${esc(t("selfuse",{p:pct0(Y.pvself/Y.pv)}))}</div>`],
  ];
  const KI = ["zap","banknote","cloud","flame","sun"];
  document.getElementById("kpis").innerHTML = k.map(([l,v,u,d],i)=>`<div class="card kpi"><div class="lab">${ic(KI[i])}${esc(l)}</div><div class="val">${v}<small>${esc(u)}</small></div>${d}</div>`).join("");
  // monthly
  const labels = Array.from({length:12},(_,m)=>monthName(m));
  barStack(document.getElementById("ch-monthly"), labels, [
    {name:t("s_elec"), color:"--elec", values:Y.monthly.map(x=>x.elec)},
    {name:t("s_hfossil"), color:"--heat-fossil", values:Y.monthly.map(x=>x.hf)},
    {name:t("s_hren"), color:"--heat-ren", values:Y.monthly.map(x=>x.hr)},
  ], v=>nf(v/1000)+" MWh");
  legend(document.getElementById("lg-monthly"), [[t("s_elec"),"--elec"],[t("s_hfossil"),"--heat-fossil"],[t("s_hren"),"--heat-ren"]]);
  // trajectory 2021..2030
  const tl = []; for (let y=2021;y<=2030;y++) tl.push(String(y));
  const base = B0.co2/1000, goal = base*(1+D.meta.targets["2030"].co2);
  const actual = tl.map(y=>M.years[+y]?M.years[+y].co2/1000:null);
  const target = tl.map((y,i)=>base + (goal-base)*i/9);
  lineChart(document.getElementById("ch-traj"), tl, [
    {name:t("s_target"), color:"--muted", values:target, dash:true, width:1.6},
    {name:t("s_actual"), color:"--accent", values:actual, dots:true, width:2.6},
  ], v=>nf(v)+" t", {h:250, labelStep:3, markers:[{i:YEAR-2021,color:"--accent"}]});
  legend(document.getElementById("lg-traj"), [[t("s_actual"),"--accent"],[t("s_target"),"--muted",true]]);
  renderTable();
}
function siteRows(){
  const q = QUERY.trim().toLowerCase();
  return D.sites.map(s=>{
    const cur = M.sites[s.id][YEAR], prev = M.sites[s.id][YEAR-1], c = carrierAt(s.id, (YEAR-2021)*12+11);
    return {s, c, co2:cur.co2/1000, int:cur.int, hi:cur.hi, hiEst:cur.hiEst, area:s.area_m2, delta: prev ? cur.energy/prev.energy-1 : null, alerts: alertsFor(s.id, YEAR), name:s.name[LANG]};
  }).filter(r => (!q || r.name.toLowerCase().includes(q) || t("type_"+r.s.type).toLowerCase().includes(q))
              && (FILTER==="all" || (FILTER==="fossil" && isFossil(r.c)) || (FILTER==="alert" && (r.alerts.length || (r.delta!=null && r.delta>0.12)))))
    .sort((a,b)=>{ const k = SORT.k; const va = k==="name"?a.name:(a[k]??-1), vb = k==="name"?b.name:(b[k]??-1); return (va>vb?1:va<vb?-1:0)*SORT.dir; });
}
function renderTable(){
  document.getElementById("fchips").innerHTML = ["all","fossil","alert"].map(f=>`<button class="chip ${FILTER===f?'on':''}" data-f="${f}">${esc(t("f_"+f))}</button>`).join("");
  const cols = [["name","h_site",""],["c","h_heat","hide-m"],["area","h_area","num hide-m"],["hi","h_hi","num"],["int","h_int","num hide-m"],["co2","h_co2","num"],["delta","h_delta","num"]];
  const ar = (k) => SORT.k===k ? `<span class="ar">${SORT.dir>0?"↑":"↓"}</span>` : "";
  let h = `<thead><tr>${cols.map(([k,l,c])=>`<th class="${c}" data-k="${k}">${esc(t(l))}${ar(k)}</th>`).join("")}</tr></thead><tbody>`;
  const rows = siteRows();
  for (const r of rows){
    const fos = isFossil(r.c), flag = r.alerts.length ? `<span class="pill p-warn">${ic("triangle-alert")}${esc(t("alert"))}</span>` : (r.delta!=null && r.delta>0.12 ? `<span class="pill p-warn">↑ ${esc(t("up"))}</span>` : "");
    h += `<tr data-id="${r.s.id}"><td><div class="tname">${esc(r.name)} ${flag}</div><div class="tsub">${esc(t("type_"+r.s.type))} · ${esc(r.s.quarter)}</div></td>
      <td class="hide-m"><span class="pill ${fos?'p-fossil':'p-ren'}">${esc(t("car_"+r.c))}</span></td>
      <td class="num hide-m">${r.area ? nf(r.area) + " m²" : "–"}</td><td class="num ${r.hi==null?'mut':''}">${r.hi==null?"–":nf(r.hi)+(r.hiEst?"*":"")}</td><td class="num hide-m ${r.int==null?'mut':''}">${r.int==null?"–":nf(r.int)}</td><td class="num">${nf(r.co2,1)}</td>
      <td class="num ${r.delta==null?'mut':r.delta<0?'good':'badc'}">${r.delta==null?"–":pct(r.delta)}</td></tr>`;
  }
  document.getElementById("sites").innerHTML = h + "</tbody>";
  document.getElementById("sites-note").textContent = t("hi_note") + (rows.some(r=>r.hiEst) ? " " + t("hi_est") : "");
  document.getElementById("sites-n").textContent = t("sites_n",{n:rows.length, m:D.sites.length});
}
function renderAI(elId, part){

function qrMonth(mo){ if (!/^\d{4}-\d{2}$/.test(mo||"")) return mo||"–"; const [y,m] = mo.split("-").map(Number); const i = (y-2021)*12+m-1; return i>=0 && i<D.meta.months ? monthYear(i) : mo; }
function qrUnit(it){ const m = (D.meters[it.s]||[]).find(x=>x.id===it.m); return m ? m.unit : ""; }
function qrDetail(code, it){
  const x = it.x, e = it.e!=null ? t("qr_x_est",{e:nf(it.e)+" "+qrUnit(it)}) : "";
  if (code==="negative") return e;
  if (code==="spike") return t("qr_x_spike",{x:nf(x)}) + (e ? " · "+e : "");
  if (code==="duplicate") return x==="same" ? t("qr_x_same") : t("qr_x_diff",{v:x});
  if (code==="missing") return t(x==="marked" ? "qr_x_marked" : "qr_x_no_row");
  if (code==="spike") return t("qr_x_spike",{x:nf(x)});
  if (code==="conversion") return t("qr_x_conv",{x:nf(x)});
  if (code==="submeter") return t("qr_x_sub",{x:nf(x)});
  if (code==="out_of_window") return t("qr_x_window",{x});
  if (code==="bad_month") return x==="period" ? t("qr_x_period") : t("qr_x_format",{x});
  return x==null ? "" : String(x);
}
function renderQuality(){
  if (!D?.quality) {
    document.getElementById("qr-kpis").innerHTML = "";
    document.getElementById("qr-list").innerHTML = "";
    return;
  }
  const Q = D.quality, R = Q.reimport.second, COV = Q.coverage || {};
  const rw = (n) => t(n===1 ? "qr_row" : "qr_rows");
  const k = [
    [t("qr_k_read"), nf(Q.read.mesures), rw(Q.read.mesures), t("qr_k_read_sub",{b:Q.read.batiments,c:Q.read.compteurs,i:Q.read.installations})],
    [t("qr_k_loaded"), nf(Q.loaded), rw(Q.loaded), t("qr_k_loaded_sub")],
    [t("qr_k_rejected"), nf(Q.rejected), rw(Q.rejected), t("qr_k_rejected_sub")],
    [t("qr_k_flagged"), nf(Q.flagged + Q.excluded), t("qr_points"), t("qr_k_flagged_sub",{e:Q.excluded})],
    [t("qr_k_reimport"), "+"+nf(R.added), rw(R.added), t("qr_k_reimport_sub",{s:nf(R.same),c:R.conflicts})],
    COV.pct != null ? [t("qr_k_coverage"), COV.pct+" %", "", t("qr_k_coverage_sub",{p:COV.pct,e:nf(COV.expected),l:nf(COV.loaded),m:nf(COV.missing)})] : null,
  ].filter(Boolean);
  const KI = ["file-input","database","circle-x","flag","repeat-2","percent"];
  document.getElementById("qr-kpis").innerHTML = k.map(([l,v,u,d],i)=>`<div class="card kpi"><div class="lab">${ic(KI[i])}${esc(l)}</div><div class="val">${v}<small>${esc(u)}</small></div><div class="delta mut">${esc(d)}</div></div>`).join("");
  // Re-import button — only for technique/admin on the server version
  const canImport = SERVER && USER && (USER.role==="admin" || USER.role==="technique");
  let importBtn = document.getElementById("qr-import-btn");
  if (canImport && !importBtn) {
    importBtn = document.createElement("button");
    importBtn.id = "qr-import-btn"; importBtn.className = "chip"; importBtn.textContent = t("qr_reimport_btn");
    importBtn.onclick = async () => {
      importBtn.disabled = true; importBtn.textContent = "…";
      try {
        const slug = LOC?.slug || "rive-claire";
        await fetch(`api/localities/${slug}/import`, {method:"POST"});
        const d2 = await fetch(`api/data.json?locality=${slug}`).then(r=>r.json());
        D = d2; renderQuality();
        importBtn.textContent = t("qr_reimport_ok");
      } catch(e) { importBtn.textContent = t("qr_reimport_err"); }
      setTimeout(()=>{ if(importBtn){ importBtn.disabled=false; importBtn.textContent=t("qr_reimport_btn"); } }, 3000);
    };
    document.getElementById("qr-csv").parentElement.appendChild(importBtn);
  }
  // File upload — technique/admin, server mode
  const uploadDiv = document.getElementById("qr-upload");
  if (uploadDiv) {
    if (canImport) {
      uploadDiv.classList.remove("hide");
      const inp = document.getElementById("qr-file-input");
      if (inp && !inp._wired) {
        inp._wired = true;
        inp.onchange = async () => {
          if (!inp.files?.length) return;
          const fd = new FormData(); fd.append("file", inp.files[0]);
          const slug = LOC?.slug || "rive-claire";
          try {
            const r = await fetch(`api/localities/${slug}/import`, {method:"POST", body:fd});
            if (!r.ok) throw new Error(await r.text());
            const d2 = await fetch(`api/data.json?locality=${slug}`).then(r=>r.json());
            D = d2; renderQuality();
            inp.value = "";
          } catch(e) { alert(t("qr_upload_err")+"\n"+e.message); }
        };
      }
    } else {
      uploadDiv.classList.add("hide");
    }
  }
  document.getElementById("qr-list").innerHTML = Q.checks.map(c=>{
    const pill = !c.n ? `<span class="pill p-ren">${esc(t("qr_ok"))}</span>` : c.kind==="rejected" ? `<span class="pill p-fossil">${esc(t("qr_rej"))}</span>` : c.kind==="excluded" ? `<span class="pill p-fossil">${esc(t("qr_excl"))}</span>` : `<span class="pill p-warn">${esc(t("qr_flag"))}</span>`;
    const rows = c.items.map(it=>`<tr ${it.s && D.meters[it.s] ? `data-id="${esc(it.s)}"` : ""}><td>${esc(it.m||"")}</td><td>${esc(qrMonth(it.mo))}</td><td class="num">${it.v==null?"–":nf(it.v)+" "+esc(qrUnit(it))}</td><td>${esc(qrDetail(c.code,it))}</td></tr>`).join("");
    const more = c.n > c.items.length ? `<p class="sub">${esc(t("qr_more",{n:c.n-c.items.length}))}</p>` : "";
    const table = c.n ? `<div class="tablewrap"><table><thead><tr><th>${esc(t("qr_h_meter"))}</th><th>${esc(t("qr_h_month"))}</th><th class="num">${esc(t("qr_h_value"))}</th><th>${esc(t("qr_h_detail"))}</th></tr></thead><tbody>${rows}</tbody></table></div>${more}` : "";
    return `<details class="qc"><summary>${pill}<b>${esc(t("qc_"+c.code))}</b><span class="n">${c.n}</span></summary><p class="d">${esc(t("qd_"+c.code))}</p>${table}</details>`;
  }).join("");
}

function renderLocality() {

    `<option value="${esc(l.slug)}" ${LOC && l.slug === LOC.slug ? "selected" : ""}>${esc(l.name)}</option>`

/* ---------------------------------------------------------------- routing & events */
let VIEW = "accueil";
const VIEWS = ["accueil","gestion","donnees","qualite","citoyens","carte","apropos","localites","utilisateurs"];
function route(){
  const h = location.hash.slice(1) || "accueil";
  if (h.startsWith("fiche/")) { VIEW = "carte"; renderAll(); openSheet(h.slice(6)); return; }
  if (h.startsWith("site/")) { if (VIEW !== "carte" && VIEW !== "qualite") VIEW = can("gestion") ? "gestion" : "carte"; renderAll(); openSite(h.slice(5)); return; }
  VIEW = VIEWS.includes(h) ? h : "accueil";
  if (!can(VIEW)) { const want = VIEW; VIEW = "accueil"; history.replaceState(null, "", "#accueil"); closeSiteSilently(); renderAll(); if (SERVER) openLogin(want); return; }
  closeSiteSilently(); renderAll();
}
function closeSiteSilently(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); }
function renderAll(){
  applyStatic();
  for (const v of VIEWS) document.getElementById("v-"+v).classList.toggle("hide", v!==VIEW);
  // Notice banner: dynamic per server/locality/demo context
  const noticeEl = document.querySelector(".notice");
  if (noticeEl) {
    if (SERVER && LOC) {
      if (LOC.demo) {
        noticeEl.textContent = `${LOC.name} · ${t("notice_demo")}`;
        noticeEl.style.display = "";
      } else {
        // Real municipality: no notice needed
        noticeEl.style.display = "none";
      }
    } else {
      // Static hosting: keep the original notice
      noticeEl.style.display = "";
      noticeEl.textContent = t(VIEW==="carte" ? "notice_map" : "notice");
    }
  }
  document.querySelectorAll("nav a").forEach(a=>{ a.classList.toggle("on", a.dataset.view===VIEW); a.classList.toggle("hide", !can(a.dataset.view)); });
  document.getElementById("crumb").textContent = t(NAVKEY[VIEW]);
  const cl = document.getElementById("crumb-loc");
  if (cl) cl.textContent = LOC ? LOC.name : (D?.meta?.commune || "");
  renderLocality();
  side(false); renderAcct();
  if (VIEW==="accueil") renderWelcome(); else if (VIEW==="gestion") renderManager(); else if (VIEW==="donnees") renderData(); else if (VIEW==="qualite") renderQuality(); else if (VIEW==="citoyens") renderCitizen(); else if (VIEW==="carte") renderMap(); else if (VIEW==="localites") renderLocalities(); else if (VIEW==="utilisateurs") renderUsers(); else renderAbout();

}

/* ---------------------------------------------------------------- accounts and roles (issue #15)
   Mirrors server/auth.py: the server enforces it on the data, this only hides what a role cannot use.

const ACCESS = {gestion:["admin","technique","elu"], donnees:["admin","technique"], qualite:["admin","technique"], localites:["admin"], utilisateurs:["admin"]};
const ROLES = ["admin","technique","elu","public"];

const full = () => !SERVER || ["admin","technique"].includes(ROLE());       // raw readings, quality report, exports
async function api(path, body, method = "POST"){
  const r = await fetch(path, {method, headers:{"content-type":"application/json"}, body: body ? JSON.stringify(body) : undefined, cache:"no-store"});
  if (!r.ok) throw r;
  return r.json();
}
function emptyData(name){
  // Minimal valid D so the app doesn't crash — used when a municipality has no data yet
  return {sites:[], series:{}, meters:{}, quality:null, heating_history:{}, events:[],
          meta:{commune: name||"", fictional:false, inhabitants:0, months:60,
                units:{energy:"kWh",water:"m3",co2:"kg",money:"CHF"},
                co2_kg_per_unit:{}, price_chf:{}, price_assumed:true,
                fossil_carriers:[], baseline_year:2021, targets:{}, climate:[], climate_normal:[],
                generated_by:"openEDM", source:"", no_data:true}};
}

function loadData(){
  const slug = LOC?.slug;
  const base = SERVER
    ? (slug ? `api/data.json?locality=${slug}&v=${V}&r=${ROLE()}` : `api/data.json?v=${V}&r=${ROLE()}`)
    : `data.json?v=${V}`;
  return fetch(base, SERVER ? {cache:"no-cache"} : {})
    .then(r => {
      if (!r.ok) {
        if (r.status === 503) {
          // Municipality has no data yet — stay on this municipality, show empty state
          D = emptyData(LOC?.name);
          compute();
          return;
        }
      }
      return r.json();
    })
    .then(d => { if (d) { D = d; compute(); } });
}
async function setUser(u, want){
  USER = u;
  closeLogin();
  applyStatic();     // update nav immediately with new role before data loads
  renderAcct();      // show username/role in top bar immediately
  // Load localities so the nav and data are municipality-aware
  if (SERVER) {
    const lr = await fetch("api/localities", {cache:"no-store"});
    if (lr.ok) LOCALITIES = await lr.json();
    if (LOCALITIES.length) {
      const saved = localStorage.getItem("edm-locality");
      LOC = LOCALITIES.find(l => l.slug === saved) || LOCALITIES[0];
    }
  }
  await loadData();
  if (want && can(want) && location.hash !== "#"+want) location.hash = "#"+want; else route();
}

    list.forEach(l => {

          if (cell && runs.length) cell.textContent = t("loc_readings",{n:nf(runs[0].loaded)}) + " · " + new Date(runs[0].at).toLocaleDateString(LANG==="fr"?"fr-CH":"en-GB");
        }).catch(()=>{});

  };

function locDelete(slug, name) {

  const modal = document.getElementById("login");
  document.getElementById("login-in").innerHTML = `
    <h2 style="margin-bottom:8px;color:var(--warn)">${esc(LANG==="fr"?"Supprimer la localité":"Delete locality")}</h2>
    <p style="margin-bottom:12px">${esc(LANG==="fr"
      ? `Supprimer « ${name} » et TOUTES ses données (bâtiments, compteurs, mesures, sas) ?`
      : `Delete « ${name} » and ALL its data (buildings, meters, readings, staging)?`)}</p>
    <label style="display:block;margin-bottom:12px;font-size:.9rem">
      ${esc(LANG==="fr"?"Tapez le nom pour confirmer :":"Type the name to confirm:")}
      <input id="loc-del-confirm" type="text" style="display:block;width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:6px;margin-top:4px" placeholder="${esc(name)}">
    </label>
    <div class="row" style="gap:8px">
      <button id="loc-del-ok" class="chip" style="background:var(--warn);color:#fff">${esc(LANG==="fr"?"Supprimer":"Delete")}</button>
      <button id="loc-del-cancel" class="chip">${esc(LANG==="fr"?"Annuler":"Cancel")}</button>
    </div>`;
  modal.classList.add("open");

  document.getElementById("loc-del-cancel").onclick = () => modal.classList.remove("open");
  document.getElementById("loc-del-ok").onclick = async () => {
    const answer = document.getElementById("loc-del-confirm")?.value.trim();
    if (answer !== name) {
      document.getElementById("loc-del-confirm").style.border = "1px solid var(--warn)";
      return;
    }
    modal.classList.remove("open");

    const r = await fetch(`api/localities/${slug}`, {method: "DELETE"});
    const msgEl = document.getElementById("loc-msg");

      const detail = await r.json().catch(()=>({}));
      if (msgEl) msgEl.textContent = t("loc_delete_err") + (detail.detail ? ` — ${detail.detail}` : "");
      return;
    }
    if (msgEl) msgEl.textContent = t("loc_delete_ok");

    // Refresh LOCALITIES global
    const remaining = await fetch("api/localities", {cache:"no-store"}).then(r2=>r2.ok?r2.json():[]).catch(()=>[]);
    LOCALITIES = remaining;

    if (LOC?.slug === slug) {

      LOC = remaining.length ? remaining[0] : null;

      MAP_PICKED = false; if (MAP) { MAP.destroy(); MAP = null; MAP_LOADING = false; }
      await loadData();

    }

    renderLocalities();
  };

async function switchToLocality(slug) {
  const lr = await fetch("api/localities",{cache:"no-store"}); if(lr.ok) LOCALITIES = await lr.json();
  LOC = LOCALITIES.find(l => l.slug === slug) || LOC;

}

/* ---------------------------------------------------------------- data manager (staging + production) */
let DM_TABLE = null, DM_PAGE = 1, DM_PER = 50;
let DM_STAGING = null;        // current staged_import object
let DM_STAGING_QUALITY = null;// quality report for current staging

function dmMsg(s, err=false){ const el = document.getElementById("dm-msg"); if(el){el.textContent=s; el.style.color=err?"var(--warn)":"var(--accent)";} }

// Build a lookup {table_name → {row_key → [issue_codes]}} from a quality report
function dmQualityIndex(quality){
  if (!quality?.checks) return {};
  const idx = {mesures:{}, batiments:{}, installations:{}, compteurs:{}};
  for (const ch of quality.checks) {
    for (const it of ch.items||[]) {
      // mesures: keyed by id_compteur+mois
      if (it.m && it.mo) { const k=it.m+":"+it.mo; idx.mesures[k]=(idx.mesures[k]||[]); idx.mesures[k].push({code:ch.code, kind:ch.kind}); }
      // reference tables: keyed by site
      if (it.m && !it.mo) {
        for (const tbl of ["batiments","compteurs","installations"]){
          idx[tbl][it.m]=(idx[tbl][it.m]||[]); idx[tbl][it.m].push({code:ch.code, kind:ch.kind});
        }
      }
    }
  }
  return idx;
}

function dmRowKey(tableName, row){
  if (tableName==="mesures") return `${row.id_compteur}:${row.mois}`;
  if (tableName==="batiments") return row.id_batiment||row.id_site;
  if (tableName==="installations") return row.id_installation||row.id_site;
  if (tableName==="compteurs") return row.id_compteur||row.id_site;
  return row.pos||"";
}

function dmIssueStyle(issues){
  if (!issues?.length) return "";
  const kinds = issues.map(i=>i.kind);
  if (kinds.includes("rejected")) return "background:rgba(220,38,38,.12);border-left:3px solid var(--warn)";
  if (kinds.includes("excluded")) return "background:rgba(234,179,8,.12);border-left:3px solid #ca8a04";
  return "background:rgba(234,179,8,.06);border-left:3px solid #d97706";
}

function renderData(){
  applyT(document.getElementById("v-donnees"));
  document.getElementById("dm-viewer-card").classList.add("hide");

  // ── Upload → staging (only when a municipality is selected) ───────────────
  const uploadCard = document.getElementById("dm-upload-card");
  const inp = document.getElementById("dm-file-input");

  if (!SERVER || !LOC) {
    // No active municipality: disable upload
    uploadCard.querySelector(".chip label, label.chip").style.opacity = "0.4";
    uploadCard.querySelector(".chip label, label.chip").style.pointerEvents = "none";
    document.getElementById("dm-preview").innerHTML =
      `<p class="sub" style="color:var(--warn)">⚠️ ${LANG==="fr"
        ? "Sélectionnez une municipalité pour charger des données."
        : "Select a municipality before loading data."}</p>`;
  } else {
    uploadCard.querySelector("label.chip") && (uploadCard.querySelector("label.chip").style.opacity = "");
    uploadCard.querySelector("label.chip") && (uploadCard.querySelector("label.chip").style.pointerEvents = "");
    inp.onchange = async () => {
      if (!inp.files?.length) return;
      const preview = document.getElementById("dm-preview");
      const slug = LOC.slug;
      preview.innerHTML = `<p class="sub">⏳ ${esc(inp.files[0].name)} → ${esc(LOC.name)}…</p>`;
      const fd = new FormData(); fd.append("file", inp.files[0]);
      try {
        const r = await fetch(`api/localities/${slug}/staging`, {method:"POST", body:fd});
        if (!r.ok) throw new Error(await r.text());
        const res = await r.json();
        preview.innerHTML = "";
        inp.value = "";
        await dmLoadStagings(res.staging_id);
      } catch(e) { preview.innerHTML = `<p style="color:var(--warn)">${esc(String(e))}</p>`; }
    };
  }

  dmLoadStagings();
  dmLoadTables();
}

async function dmLoadStagings(openId){
  const slug = LOC?.slug || "rive-claire";
  const r = await fetch(`api/localities/${slug}/staging`, {cache:"no-store"});
  if (!r.ok) return;
  const list = await r.json();
  const pending = list.filter(s => s.status === "pending");
  const preview = document.getElementById("dm-preview");

  if (!pending.length) { preview.innerHTML = ""; return; }

  const qBadge = q => {
    if (!q) return "";
    const rej = q.rejected||0, flag = q.flagged||0, excl = q.excluded||0;
    const parts = [];
    if (rej) parts.push(`<span class="pill p-fossil">${rej} rejet${rej>1?"s":""}</span>`);
    if (excl) parts.push(`<span class="pill p-warn">${excl} remplac${excl>1?"és":"é"}</span>`);
    if (flag) parts.push(`<span class="pill p-warn">${flag} ${LANG==="fr"?"à vérifier":"to check"}</span>`);
    if (!parts.length) parts.push(`<span class="pill p-ren">OK</span>`);
    return parts.join(" ");
  };

  preview.innerHTML = `
    <h3 style="margin:12px 0 8px">${LANG==="fr"?"Sas en attente":"Pending staging"} (${pending.length})</h3>
    ${pending.map(s=>`
    <div class="card" style="margin-bottom:8px;padding:12px 16px">
      <div class="row">
        <div>
          <b>${esc(s.source)}</b>
          <span class="sub" style="margin-left:8px">${new Date(s.uploaded_at).toLocaleString(LANG==="fr"?"fr-CH":"en-GB")} · ${s.files} ${LANG==="fr"?"tables":"tables"}</span>
        </div>
        <div class="spacer"></div>
        ${qBadge(s.quality)}
        <button class="chip" style="margin-left:8px" onclick="dmOpenStaging(${s.id})">${LANG==="fr"?"Ouvrir le sas":"Open staging"}</button>
        <button class="chip" style="margin-left:4px;color:var(--warn)" onclick="dmDiscardStaging(${s.id})">${LANG==="fr"?"Annuler":"Discard"}</button>
      </div>
    </div>`).join("")}`;

  if (openId) {
    const found = pending.find(s => s.id === openId);
    if (found) dmOpenStaging(openId);
  }
}

async function dmOpenStaging(stagingId){
  const slug = LOC?.slug || "rive-claire";
  const r = await fetch(`api/localities/${slug}/staging/${stagingId}`);
  if (!r.ok) return;
  DM_STAGING = await r.json();
  DM_STAGING_QUALITY = DM_STAGING.quality;

  const vc = document.getElementById("dm-viewer-card");
  const qi = dmQualityIndex(DM_STAGING_QUALITY);

  // Build quality summary
  const q = DM_STAGING_QUALITY;
  const qHtml = q ? `
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:8px">
      ${q.rejected ? `<span class="pill p-fossil">${nf(q.rejected)} ${LANG==="fr"?"rejeté(s)":"rejected"}</span>` : ""}
      ${q.excluded ? `<span class="pill p-warn">${nf(q.excluded)} ${LANG==="fr"?"remplacé(s)":"replaced"}</span>` : ""}
      ${q.flagged  ? `<span class="pill p-warn">${nf(q.flagged)} ${LANG==="fr"?"à vérifier":"to check"}</span>` : ""}
      ${!q.rejected&&!q.excluded&&!q.flagged ? `<span class="pill p-ren">OK</span>` : ""}
      <button class="chip" onclick="dmRecheck(${stagingId})" style="font-size:.8rem">${LANG==="fr"?"↺ Re-vérifier":"↺ Re-check"}</button>
    </div>` : "";

  // Files as buttons
  const filesBtns = DM_STAGING.files.map(f => {
    const issues = Object.keys(qi[f.table_name]||{}).length;
    const icon = issues ? `<span class="pill p-warn">${issues}</span> ` : `<span class="pill p-ren">✓</span> `;
    return `<button class="chip ${DM_TABLE===f.table_name?"on":""}" style="margin:2px" onclick="dmOpenStagingTable(${stagingId},'${esc(f.table_name)}')">${icon}${esc(f.table_name)} (${nf(f.row_count)})</button>`;
  }).join("");

  document.getElementById("dm-viewer-title").innerHTML = `${LANG==="fr"?"Sas":"Staging"} #${stagingId} <span class="sub" style="font-weight:normal;font-size:.85rem">${esc(DM_STAGING.source)}</span>`;
  document.getElementById("dm-viewer-info").innerHTML = qHtml + filesBtns;
  document.getElementById("dm-viewer-close").onclick = () => { vc.classList.add("hide"); DM_STAGING=null; DM_TABLE=null; };
  document.getElementById("dm-pager").innerHTML = `
    <button class="chip" onclick="dmCommitStaging(${stagingId})" style="background:var(--accent);color:#fff">${LANG==="fr"?"✓ Commit en production":"✓ Commit to production"}</button>
    <button class="chip" onclick="dmDiscardStaging(${stagingId})" style="color:var(--warn)">${LANG==="fr"?"✗ Annuler le sas":"✗ Discard"}</button>`;
  document.getElementById("dm-search").oninput = () => DM_TABLE && dmOpenStagingTable(stagingId, DM_TABLE, 1);
  document.getElementById("dm-replace-label").style.display = "none";

  vc.classList.remove("hide");
  vc.scrollIntoView({behavior:"smooth", block:"nearest"});

  // Auto-open the first file with issues, or just the first file
  const firstIssue = DM_STAGING.files.find(f => Object.keys(qi[f.table_name]||{}).length > 0);
  const toOpen = firstIssue || DM_STAGING.files[0];
  if (toOpen) dmOpenStagingTable(stagingId, toOpen.table_name);
}

let DM_ANOMALIES_ONLY = false;

async function dmOpenStagingTable(stagingId, tableName, page=1, anomaliesOnly=DM_ANOMALIES_ONLY){
  DM_TABLE = tableName; DM_PAGE = page; DM_ANOMALIES_ONLY = anomaliesOnly;
  const slug = LOC?.slug || "rive-claire";

  let data;
  if (anomaliesOnly) {
    const r = await fetch(`api/localities/${slug}/staging/${stagingId}/files/${tableName}/anomalies`);
    if (!r.ok) return;
    const raw = await r.json();
    // anomalies endpoint returns flat list with _row_idx; wrap to match paged format
    data = {total: raw.total, page: 1, per_page: raw.total, rows: raw.rows};
  } else {
    const r2 = await fetch(`api/localities/${slug}/staging/${stagingId}/files/${tableName}?page=${page}&per_page=${DM_PER}`);
    if (!r2.ok) return;
    data = await r2.json();
  }

  // ── Update header: show current table name prominently ──────────────────────
  const fileInfo = DM_STAGING?.files?.find(f => f.table_name === tableName);
  document.getElementById("dm-viewer-title").innerHTML =
    `<span style="font-size:.8rem;font-weight:400;color:var(--muted);display:block;margin-bottom:2px">`+
    `${LANG==="fr"?"Sas":"Staging"} #${stagingId} · ${esc(DM_STAGING?.source||"")}</span>`+
    `<span>${esc(tableName)}</span>`+
    (fileInfo ? ` <span class="sub" style="font-weight:400;font-size:.85rem">${nf(fileInfo.row_count)} ${LANG==="fr"?"lignes":"rows"}</span>` : "");

  const qi = dmQualityIndex(DM_STAGING_QUALITY);
  const tableIssues = qi[tableName]||{};
  const issueCount = Object.keys(tableIssues).length;
  const isCore = ["batiments","installations","compteurs","mesures"].includes(tableName);
  const startIdx = anomaliesOnly ? 0 : (page-1)*DM_PER;

  if (!data.rows.length) {
    document.getElementById("dm-viewer-table").innerHTML =
      `<p class="sub">${anomaliesOnly ? (LANG==="fr"?"Aucune anomalie dans cette table ✓":"No anomalies in this table ✓") : "–"}</p>`;
  } else {
    const allCols = Object.keys(data.rows[0]);
    const cols = allCols.filter(c => c !== "_row_idx");  // hide the internal index column
    const thead = `<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th></th></tr>`;
    const tbody = data.rows.map((row, i) => {
      const rowIdx = anomaliesOnly ? (row._row_idx ?? startIdx + i) : startIdx + i;
      const key = dmRowKey(tableName, row);
      const issues = tableIssues[key]||[];
      const style = dmIssueStyle(issues);
      const issuePills = issues.map(iss=>`<span class="pill ${iss.kind==="rejected"?"p-fossil":"p-warn"}" style="font-size:.7rem">${esc(iss.code)}</span>`).join(" ");
      const cells = cols.map(c=>`<td style="white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis" title="${esc(String(row[c]??''))}">${esc(String(row[c]??''))}</td>`).join("");
      const actions = `<td style="white-space:nowrap">${issuePills}
        <button class="chip" style="font-size:.7rem;margin-left:4px" onclick="dmEditStagingRow(${stagingId},'${esc(tableName)}',${rowIdx})">✏️</button>
        <button class="chip" style="font-size:.7rem;color:var(--warn)" onclick="dmDeleteStagingRow(${stagingId},'${esc(tableName)}',${rowIdx})">✕</button></td>`;
      return `<tr style="${style}">${cells}${actions}</tr>`;
    }).join("");
    document.getElementById("dm-viewer-table").innerHTML = `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  }

  const totalPages = Math.ceil(data.total / DM_PER);
  const pagerRow = document.getElementById("dm-pager");
  const anomBtn = `<button class="chip ${anomaliesOnly?"on":""}" onclick="dmOpenStagingTable(${stagingId},'${esc(tableName)}',1,${!anomaliesOnly})" style="${issueCount&&!anomaliesOnly?"color:var(--warn)":""}">
    ⚠️ ${issueCount} ${LANG==="fr"?"anomalie(s)":"anomaly(ies)"}${anomaliesOnly?" — "+t("dm_all_rows"):""}</button>`;
  const commitDiscard = `<button class="chip" onclick="dmCommitStaging(${stagingId})" style="background:var(--accent);color:#fff">✓ Commit</button>
    <button class="chip" onclick="dmDiscardStaging(${stagingId})" style="color:var(--warn)">✗</button>`;
  const pageNav = !anomaliesOnly ? `${page>1?`<button class="chip" onclick="dmOpenStagingTable(${stagingId},'${esc(tableName)}',${page-1},false)">${esc(t("dm_prev"))}</button>`:""}
    <span class="sub" style="line-height:2">${page}/${totalPages}</span>
    ${page<totalPages?`<button class="chip" onclick="dmOpenStagingTable(${stagingId},'${esc(tableName)}',${page+1},false)">${esc(t("dm_next"))}</button>`:""}` : "";
  pagerRow.innerHTML = `${anomBtn}${commitDiscard}<div class="spacer"></div>${pageNav}`;
}

async function dmEditStagingRow(stagingId, tableName, rowIdx){
  const slug = LOC?.slug || "rive-claire";
  // Fetch just the one page containing this row
  const page = Math.floor(rowIdx / DM_PER) + 1;
  const r = await fetch(`api/localities/${slug}/staging/${stagingId}/files/${tableName}?page=${page}&per_page=${DM_PER}`);
  if (!r.ok) return;
  const data = await r.json();
  const localIdx = rowIdx % DM_PER;
  const row = data.rows[localIdx];
  if (!row) return;

  // Build edit form in the login modal (repurposed)
  const cols = Object.keys(row);
  const form = `<h2 style="margin-bottom:12px">${LANG==="fr"?"Modifier la ligne":"Edit row"} ${rowIdx}</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:60vh;overflow-y:auto">
    ${cols.map(c=>`<label style="display:block"><span style="font-size:.8rem;color:#888">${esc(c)}</span>
      <input id="edit-${esc(c)}" value="${esc(String(row[c]??''))}" style="display:block;width:100%;padding:4px 6px;border:1px solid #ddd;border-radius:4px;margin-top:2px">
    </label>`).join("")}
    </div>
    <div class="row" style="gap:8px;margin-top:12px">
      <button class="chip" style="background:var(--accent);color:#fff" id="edit-save">${LANG==="fr"?"Enregistrer":"Save"}</button>
      <button class="chip" id="edit-cancel">${LANG==="fr"?"Annuler":"Cancel"}</button>
    </div>`;
  const modal = document.getElementById("login");
  document.getElementById("login-in").innerHTML = form;
  modal.classList.add("open");
  document.getElementById("edit-cancel").onclick = () => modal.classList.remove("open");
  document.getElementById("edit-save").onclick = async () => {
    const updated = {};
    for (const c of cols) updated[c] = document.getElementById("edit-"+c)?.value ?? row[c];
    modal.classList.remove("open");
    const rPut = await fetch(`api/localities/${slug}/staging/${stagingId}/files/${tableName}/${rowIdx}`, {
      method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(updated)});
    if (rPut.ok) {
      dmMsg(LANG==="fr"?"Ligne mise à jour.":"Row updated.");
      dmOpenStagingTable(stagingId, tableName, DM_PAGE);
    } else { dmMsg(await rPut.text(), true); }
  };
}

async function dmDeleteStagingRow(stagingId, tableName, rowIdx){
  const slug = LOC?.slug || "rive-claire";
  const r = await fetch(`api/localities/${slug}/staging/${stagingId}/files/${tableName}/${rowIdx}`, {method:"DELETE"});
  if (r.ok) { dmMsg(t("dm_del_ok")); dmOpenStagingTable(stagingId, tableName, DM_PAGE); }
  else dmMsg(await r.text(), true);
}

async function dmRecheck(stagingId){
  const slug = LOC?.slug || "rive-claire";
  dmMsg(LANG==="fr"?"Contrôle en cours…":"Running checks…");
  const r = await fetch(`api/localities/${slug}/staging/${stagingId}/check`, {method:"POST"});
  if (r.ok) { DM_STAGING_QUALITY = await r.json(); dmMsg(LANG==="fr"?"Contrôle terminé.":"Check complete."); dmOpenStaging(stagingId); }
  else dmMsg(await r.text(), true);
}

async function dmCommitStaging(stagingId){
  const slug = LOC?.slug || "rive-claire";
  dmMsg(LANG==="fr"?"Commit en cours…":"Committing…");
  const r = await fetch(`api/localities/${slug}/staging/${stagingId}/commit`, {method:"POST"});
  if (r.ok) {
    const res = await r.json();
    document.getElementById("dm-viewer-card").classList.add("hide");
    DM_STAGING = null; DM_TABLE = null;
    // Reload data and refresh all views
    const d2 = await fetch(`api/data.json?locality=${slug}`).then(r2=>r2.json());
    D = d2;
    compute();      // recalculate metrics from new data
    renderAll();    // refresh Manage, Quality, Citizens, etc.
    dmLoadStagings();
    dmLoadTables();
    dmMsg(`${LANG==="fr"?"Données chargées":"Data loaded"} — +${nf(res.added||0)} ${LANG==="fr"?"ajoutés":"added"}, ${nf(res.unchanged||0)} inchangés`);
  } else { dmMsg(await r.text(), true); }
}

async function dmDiscardStaging(stagingId){
  const slug = LOC?.slug || "rive-claire";
  const r = await fetch(`api/localities/${slug}/staging/${stagingId}`, {method:"DELETE"});
  if (r.ok) {
    dmMsg(LANG==="fr"?"Sas annulé.":"Staging discarded.");
    document.getElementById("dm-viewer-card").classList.add("hide");
    DM_STAGING = null; DM_TABLE = null;
    dmLoadStagings();
    renderAll();   // refresh nav state
  } else dmMsg(await r.text(), true);
}

function dmLoadTables(){
  const slug = LOC?.slug || "rive-claire";
  fetch(`api/localities/${slug}/data`, {cache:"no-store"})
    .then(r => r.ok ? r.json() : [])
    .then(tables => {
      const tb = document.getElementById("dm-tables");
      if (!tables.length) { tb.innerHTML = `<p class="sub">–</p>`; return; }
      tb.innerHTML = `<div class="tablewrap"><table><thead><tr>
        <th>Table</th><th class="num">${LANG==="fr"?"Lignes":"Rows"}</th><th></th>
      </tr></thead><tbody>
      ${tables.map(tbl => `<tr>
        <td><b>${esc(tbl.name)}</b></td>
        <td class="num">${nf(tbl.rows)}</td>
        <td><button class="chip" onclick="dmOpenProductionTable('${esc(tbl.name)}')">${esc(t("dm_view_btn"))}</button></td>
      </tr>`).join("")}
      </tbody></table></div>`;
    }).catch(() => {});
}

async function dmOpenProductionTable(tableName, page=1){
  DM_TABLE = tableName; DM_PAGE = page; DM_STAGING = null;
  const slug = LOC?.slug || "rive-claire";
  const r = await fetch(`api/localities/${slug}/data/${tableName}?page=${page}&per_page=${DM_PER}`);
  if (!r.ok) return;
  const data = await r.json();
  const startIdx = (page-1)*DM_PER;
  const vc = document.getElementById("dm-viewer-card");
  document.getElementById("dm-viewer-title").textContent = `${tableName} ${LANG==="fr"?"(production)":"(production)"}`;
  document.getElementById("dm-viewer-info").textContent = t("dm_viewer_rows",{n:nf(data.total)});
  document.getElementById("dm-viewer-close").onclick = () => vc.classList.add("hide");
  document.getElementById("dm-search").oninput = () => dmOpenProductionTable(tableName, 1);
  document.getElementById("dm-replace-label").style.display = "";
  document.getElementById("dm-replace-label").dataset.table = tableName;

  if (!data.rows.length) { document.getElementById("dm-viewer-table").innerHTML = `<p class="sub">–</p>`; vc.classList.remove("hide"); return; }
  const cols = Object.keys(data.rows[0]).filter(c => !["locality_id","import_id","pos"].includes(c));
  const isCore = ["batiments","installations","compteurs","mesures"].includes(tableName);
  const thead = `<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}${isCore?`<th></th>`:""}</tr>`;
  const tbody = data.rows.map((row, i) => {
    const cells = cols.map(c=>`<td style="white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${esc(String(row[c]??''))}">${esc(String(row[c]??''))}</td>`).join("");
    let key = "";
    if (tableName==="mesures") key = `${row.id_compteur}:${row.mois}`;
    else if (row.id_batiment) key = row.id_batiment;
    else if (row.id_installation) key = row.id_installation;
    else if (row.id_compteur) key = row.id_compteur;
    const del = isCore&&key ? `<td><button class="chip" style="font-size:.75rem;color:var(--warn)" onclick="dmDeleteProductionRow('${esc(tableName)}','${esc(key)}')">${esc(t("dm_del_row"))}</button></td>` : (isCore?"<td></td>":"");
    return `<tr>${cells}${del}</tr>`;
  }).join("");
  document.getElementById("dm-viewer-table").innerHTML = `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;

  const totalPages = Math.ceil(data.total / DM_PER);
  const pager = document.getElementById("dm-pager");
  pager.innerHTML = `${page>1?`<button class="chip" onclick="dmOpenProductionTable('${esc(tableName)}',${page-1})">${esc(t("dm_prev"))}</button>`:""}
    <span class="sub" style="line-height:2">${page}/${totalPages}</span>
    ${page<totalPages?`<button class="chip" onclick="dmOpenProductionTable('${esc(tableName)}',${page+1})">${esc(t("dm_next"))}</button>`:""}`;

  const replaceInp = document.getElementById("dm-replace-input");
  replaceInp.onchange = async () => {
    if (!replaceInp.files?.length) return;
    const fd = new FormData(); fd.append("file", replaceInp.files[0]);
    const r2 = await fetch(`api/localities/${slug}/data/${tableName}/replace`, {method:"POST", body:fd});
    if (r2.ok) { dmMsg(t("dm_replace_ok")); dmLoadTables(); dmOpenProductionTable(tableName, 1); }
    else dmMsg(t("dm_replace_err") + " " + await r2.text(), true);
    replaceInp.value = "";
  };

  vc.classList.remove("hide");
  vc.scrollIntoView({behavior:"smooth", block:"nearest"});
}

async function dmDeleteProductionRow(tableName, key){
  const slug = LOC?.slug || "rive-claire";
  const r = await fetch(`api/localities/${slug}/data/${tableName}/${encodeURIComponent(key)}`, {method:"DELETE"});
  if (r.ok) { dmMsg(t("dm_del_ok")); dmOpenProductionTable(tableName, DM_PAGE); }
  else dmMsg(t("dm_del_err"), true);
}

function renderUsers(){
  const tb = document.getElementById("u-table"), msg = (s) => document.getElementById("u-msg").textContent = s;
  document.getElementById("u-roles").innerHTML = `<thead><tr><th>${esc(t("u_h_role"))}</th><th>${esc(t("u_h_sees"))}</th></tr></thead><tbody>` +
    ROLES.map(r=>`<tr style="cursor:default"><td><b>${esc(t("role_"+r))}</b></td><td>${esc(t("rd_"+r))}</td></tr>`).join("") + `</tbody>`;
  fetch("api/users", {cache:"no-store"}).then(r => r.ok ? r.json() : Promise.reject(r)).then(list => {
    tb.innerHTML = `<thead><tr><th>${esc(t("u_h_user"))}</th><th>${esc(t("u_h_role"))}</th></tr></thead><tbody>` + list.map(u => {
      const fixed = u.username === USER.username || u.username.startsWith("demo-") || (USER.demo && !u.demo);
      const cell = fixed ? esc(t("role_"+u.role)) : `<select class="urole" data-u="${esc(u.username)}" aria-label="${esc(t("u_h_role"))}">${ROLES.map(r=>`<option value="${r}"${r===u.role?" selected":""}>${esc(t("role_"+r))}</option>`).join("")}</select>`;
      return `<tr style="cursor:default"><td><div class="tname">${esc(u.username)}</div>${u.demo?`<div class="tsub">${esc(t("u_demo"))}</div>`:""}</td><td>${cell}</td></tr>`;
    }).join("") + `</tbody>`;
    tb.querySelectorAll("select").forEach(s => s.onchange = () => api("api/users/"+encodeURIComponent(s.dataset.u), {role:s.value}, "PUT")
      .then(() => msg(t("u_saved"))).catch(() => { msg(t("u_err")); renderUsers(); }));
  }).catch(() => { tb.innerHTML = ""; msg(t("u_err")); });
}

  const el = ev.target.closest("[data-lang],[data-y],[data-f],th[data-k],tbody tr[data-id]"); if (!el) return;
  if (el.dataset.lang){ LANG = el.dataset.lang; try{localStorage.setItem("edm-lang",LANG);}catch(e){} const open = document.getElementById("drawer").classList.contains("open"); renderAll(); if (open) reopen(); }
  else if (el.dataset.y){ YEAR = +el.dataset.y; renderManager(); }
  else if (el.dataset.f){ FILTER = el.dataset.f; renderTable(); }
  else if (el.dataset.k){ SORT = {k:el.dataset.k, dir: SORT.k===el.dataset.k ? -SORT.dir : (el.dataset.k==="name"||el.dataset.k==="c"?1:-1)}; renderTable(); }
  else if (el.dataset.id){ openSite(el.dataset.id); }
});
