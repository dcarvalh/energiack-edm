*{box-sizing:border-box}

/* app shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px}

.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);min-width:0;white-space:nowrap}

.side-scrim{display:none}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:3px 9px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:550;font-size:12.5px;font-variant-numeric:tabular-nums}

.list{margin:0;padding-left:18px}

/* ---------------------------------------------------------------- data */
let D, R = null, M = {};      // data, AI report, computed metrics
const YEARS = [2021,2022,2023,2024,2025];
let YEAR = 2025, FILTER = "all", SORT = {k:"co2", dir:-1}, QUERY = "";

function carrierAt(sid, m){ let c = D.heating_history[sid][0].carrier; for (const h of D.heating_history[sid]) if (m >= h.from_month) c = h.carrier; return c; }
const isFossil = (c) => D.meta.fossil_carriers.includes(c);

function compute(){
  // per site, per month: grid, heat (+carrier), co2, cost
  const sites = {}, years = {};
  for (const y of YEARS) years[y] = {energy:0, cost:0, co2:0, elec:0, hf:0, hr:0, pv:0, pvself:0, water:0, fossilSites:0, monthly:Array.from({length:12},()=>({elec:0,hf:0,hr:0}))};
  for (const s of D.sites){
    const S = D.series[s.id]; const per = {};
    for (const y of YEARS) per[y] = {energy:0, co2:0, cost:0, heat:0, elec:0, pv:0, pvself:0, water:0};
    for (let m=0; m<D.meta.months; m++){
      const y = YEARS[Math.floor(m/12)], mo = m%12, c = carrierAt(s.id, m);
      const g = S.elec_grid[m], h = S.heat[m], pv = S.pv_prod ? S.pv_prod[m] : 0, inj = S.pv_inject ? S.pv_inject[m] : 0;
      const co2 = S.co2[m], cost = S.cost[m];
      const P = per[y]; P.energy += g+h; P.co2 += co2; P.cost += cost; P.heat += h; P.elec += g; P.pv += pv; P.pvself += pv-inj; P.water += S.water[m];
      const Y = years[y]; Y.energy += g+h; Y.co2 += co2; Y.cost += cost; Y.elec += g; Y.pv += pv; Y.pvself += pv-inj; Y.water += S.water[m];
      Y.monthly[mo].elec += g;
      if (isFossil(c)) { Y.hf += h; Y.monthly[mo].hf += h; } else { Y.hr += h; Y.monthly[mo].hr += h; }
    }
    for (const y of YEARS){
      if (isFossil(carrierAt(s.id, (y-2021)*12+11))) years[y].fossilSites++;
      per[y].int = s.area_m2 ? per[y].energy / s.area_m2 : null;
    }
    sites[s.id] = per;
  }
  M = {sites, years};
}
function alertsFor(sid, y){
  const out = [];
  for (const e of D.events) if (e.site === sid && (e.kind === "anomaly" || e.kind === "quality") && (e.months || [e.month]).some(m => Math.floor(m/12) === y-2021)) out.push(e);
  return out;
}

/* ---------------------------------------------------------------- charts (plain SVG) */
const tip = document.getElementById("tip");
function showTip(ev, html){ tip.innerHTML = html; tip.style.opacity = 1; const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, yy = ev.clientY - h - 10; if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (yy < 8) yy = ev.clientY + 16; tip.style.left = x+"px"; tip.style.top = yy+"px"; }
function hideTip(){ tip.style.opacity = 0; }
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v||1))); for (const k of [1,1.5,2,2.5,3,4,5,6,8,10]) if (k*p >= v) return k*p; return 10*p; }
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const widthOf = (el) => Math.max(300, Math.round(el.clientWidth || el.parentElement.clientWidth || 640));
function barStack(el, labels, series, fmt){
  const W = widthOf(el), H = 240, L = 40, B = 24, Tp = 8, n = labels.length, bw = (W-L)/n;
  const tot = labels.map((_,i)=>series.reduce((a,s)=>a+s.values[i],0)); const max = niceMax(Math.max(...tot));
  let g = "";
  for (let k=0;k<=4;k++){ const yv = max*k/4, y = H-B-(H-B-Tp)*k/4; g += `<line class="gridl" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${nf(yv/1000)}</text>`; }
  labels.forEach((lab,i)=>{
    let y0 = H-B; const x = L + i*bw + bw*0.18, w = bw*0.64;
    series.forEach((s,j)=>{ const h = (H-B-Tp)*s.values[i]/max; if (h<=0) return; y0 -= h; g += `<rect x="${x}" y="${y0}" width="${w}" height="${h}" fill="${css(s.color)}" ${j===series.length-1?'rx="3"':''}/>`; });
    g += `<rect class="hit" data-i="${i}" x="${L+i*bw}" y="${Tp}" width="${bw}" height="${H-B-Tp}" fill="transparent"/>`;
    if (bw >= 34 || i % 2 === 0) g += `<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
  el.querySelectorAll(".hit").forEach(r => { const i = +r.dataset.i;
    r.addEventListener("mousemove", ev => showTip(ev, `<b>${esc(labels[i])}</b><br>` + series.map(s=>`${esc(s.name)}${t("colon")}${fmt(s.values[i])}`).join("<br>") + `<br><b>Total${t("colon")}${fmt(tot[i])}</b>`));
    r.addEventListener("mouseleave", hideTip); });
}
function lineChart(el, labels, series, fmt, opts={}){
  const W = widthOf(el), H = opts.h || 240, L = 44, B = 24, Tp = 10, n = labels.length;
  const all = series.flatMap(s=>s.values.filter(v=>v!=null)); const max = niceMax(Math.max(...all)*1.05);
  const X = (i) => L + (W-L-10) * (n===1?0.5:i/(n-1)), Y = (v) => H-B-(H-B-Tp)*v/max;
  let g = "";
  for (let k=0;k<=4;k++){ const yv = max*k/4; g += `<line class="gridl" x1="${L}" x2="${W}" y1="${Y(yv)}" y2="${Y(yv)}"/><text x="${L-6}" y="${Y(yv)+4}" text-anchor="end">${opts.ytick?opts.ytick(yv):nf(yv)}</text>`; }
  const step = opts.labelStep || 1;
  labels.forEach((lab,i)=>{ if (i%step===0) g += `<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`; });
  for (const s of series){
    const pts = s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
    g += `<path d="${d}" fill="none" stroke="${css(s.color)}" stroke-width="${s.width||2.2}" ${s.dash?'stroke-dasharray="5 5"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.dots) pts.forEach(p=> g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${css(s.color)}"/>`);
  }
  if (opts.markers) for (const mk of opts.markers) g += `<line x1="${X(mk.i)}" x2="${X(mk.i)}" y1="${Tp}" y2="${H-B}" stroke="${css(mk.color||"--muted")}" stroke-dasharray="2 4" opacity=".7"/>`;
  const bw = (W-L-10)/Math.max(n-1,1);
  labels.forEach((lab,i)=> g += `<rect class="hit" data-i="${i}" x="${X(i)-bw/2}" y="${Tp}" width="${bw}" height="${H-B-Tp}" fill="transparent"/>`);
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
  el.querySelectorAll(".hit").forEach(r => { const i = +r.dataset.i;
    r.addEventListener("mousemove", ev => showTip(ev, `<b>${esc(opts.tipLabel?opts.tipLabel(i):labels[i])}</b><br>` + series.filter(s=>s.values[i]!=null).map(s=>`${esc(s.name)}${t("colon")}${fmt(s.values[i])}`).join("<br>")));
    r.addEventListener("mouseleave", hideTip); });
}
const legend = (el, items) => el.innerHTML = items.map(([n,c,dash])=>`<span><i style="background:${dash?'transparent':css(c)};${dash?`border:2px dashed ${css(c)};width:12px;height:2px;border-radius:0;vertical-align:3px;border-width:2px 0 0 0`:''}"></i>${esc(n)}</span>`).join("");

function deltaHtml(cur, ref, label, goodIfDown=true){
  if (!ref) return "";
  const d = cur/ref - 1, good = goodIfDown ? d < 0 : d > 0;
  return `<div class="delta ${Math.abs(d)<0.005?'mut':good?'good':'badc'}">${pct(d,1)} <span class="mut" style="font-weight:500">${esc(label)}</span></div>`;

function renderManager(){
  const Y = M.years[YEAR], P = M.years[YEAR-1], B0 = M.years[D.meta.baseline_year];
  document.getElementById("years").innerHTML = YEARS.map(y=>`<button data-y="${y}" class="${y===YEAR?'on':''}">${y}</button>`).join("");
  const k = [
    [t("k_energy"), nf(Y.energy/1e6,2), "GWh", P?deltaHtml(Y.energy,P.energy,t("vs_prev",{y:YEAR-1})):""],
    [t("k_cost"), nf(Y.cost/1e6,2), "M CHF", P?deltaHtml(Y.cost,P.cost,t("vs_prev",{y:YEAR-1})):""],
    [t("k_co2"), nf(Y.co2/1000), "t", YEAR!==D.meta.baseline_year?deltaHtml(Y.co2,B0.co2,t("vs_base",{y:D.meta.baseline_year})):""],
    [t("k_fossil"), nf(Y.fossilSites), t("of_sites",{n:D.sites.length}), P&&P.fossilSites!==Y.fossilSites?`<div class="delta good">${Y.fossilSites-P.fossilSites} <span class="mut" style="font-weight:500">${esc(t("vs_prev",{y:YEAR-1}))}</span></div>`:""],
    [t("k_solar"), nf(Y.pv/1000), "MWh", `<div class="delta mut">${esc(t("selfuse",{p:pct0(Y.pvself/Y.pv)}))}</div>`],
  ];
  const KI = ["zap","banknote","cloud","flame","sun"];
  document.getElementById("kpis").innerHTML = k.map(([l,v,u,d],i)=>`<div class="card kpi"><div class="lab">${ic(KI[i])}${esc(l)}</div><div class="val">${v}<small>${esc(u)}</small></div>${d}</div>`).join("");
  // monthly
  const labels = Array.from({length:12},(_,m)=>monthName(m));
  barStack(document.getElementById("ch-monthly"), labels, [
    {name:t("s_elec"), color:"--elec", values:Y.monthly.map(x=>x.elec)},
    {name:t("s_hfossil"), color:"--heat-fossil", values:Y.monthly.map(x=>x.hf)},
    {name:t("s_hren"), color:"--heat-ren", values:Y.monthly.map(x=>x.hr)},
  ], v=>nf(v/1000)+" MWh");
  legend(document.getElementById("lg-monthly"), [[t("s_elec"),"--elec"],[t("s_hfossil"),"--heat-fossil"],[t("s_hren"),"--heat-ren"]]);
  // trajectory 2021..2030
  const tl = []; for (let y=2021;y<=2030;y++) tl.push(String(y));
  const base = B0.co2/1000, goal = base*(1+D.meta.targets["2030"].co2);
  const actual = tl.map(y=>M.years[+y]?M.years[+y].co2/1000:null);
  const target = tl.map((y,i)=>base + (goal-base)*i/9);
  lineChart(document.getElementById("ch-traj"), tl, [
    {name:t("s_target"), color:"--muted", values:target, dash:true, width:1.6},
    {name:t("s_actual"), color:"--accent", values:actual, dots:true, width:2.6},
  ], v=>nf(v)+" t", {h:250, labelStep:3, markers:[{i:YEAR-2021,color:"--accent"}]});
  legend(document.getElementById("lg-traj"), [[t("s_actual"),"--accent"],[t("s_target"),"--muted",true]]);
  renderTable();
}
function siteRows(){
  const q = QUERY.trim().toLowerCase();
  return D.sites.map(s=>{
    const cur = M.sites[s.id][YEAR], prev = M.sites[s.id][YEAR-1], c = carrierAt(s.id, (YEAR-2021)*12+11);
    return {s, c, co2:cur.co2/1000, int:cur.int, area:s.area_m2, delta: prev ? cur.energy/prev.energy-1 : null, alerts: alertsFor(s.id, YEAR), name:s.name[LANG]};
  }).filter(r => (!q || r.name.toLowerCase().includes(q) || t("type_"+r.s.type).toLowerCase().includes(q))
              && (FILTER==="all" || (FILTER==="fossil" && isFossil(r.c)) || (FILTER==="alert" && (r.alerts.length || (r.delta!=null && r.delta>0.12)))))
    .sort((a,b)=>{ const k = SORT.k; const va = k==="name"?a.name:a[k], vb = k==="name"?b.name:b[k]; return (va>vb?1:va<vb?-1:0)*SORT.dir; });
}

  }
  document.getElementById("sites").innerHTML = h + "</tbody>";

  document.getElementById("h-defi").innerHTML = t("defi").map(([a,b])=>`<div class="card defi"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("");
  document.getElementById("h-now").innerHTML = t("now").map(([h,a,b,k])=>`<a class="card go" href="${h}"><b>${esc(a)} →</b><span>${esc(b)}</span>${k?`<i class="pill ${k==="real"?"p-ren":"p-warn"}" style="font-style:normal">${esc(t("h_"+k))}</i>`:""}</a>`).join("");
  document.getElementById("h-next").innerHTML = t("next").map(x=>`<li>${esc(x)}</li>`).join("");
  document.getElementById("h-who").innerHTML = t("who").map(([a,b,c])=>`<div class="card defi"><b>${esc(a)}</b><span>${esc(b)}</span><span class="sub" style="display:block;margin:8px 0 0">${esc(c)}</span></div>`).join("");
}
function qrMonth(mo){ if (!/^\d{4}-\d{2}$/.test(mo||"")) return mo||"–"; const [y,m] = mo.split("-").map(Number); const i = (y-2021)*12+m-1; return i>=0 && i<D.meta.months ? monthYear(i) : mo; }
function qrUnit(it){ const m = (D.meters[it.s]||[]).find(x=>x.id===it.m); return m ? m.unit : ""; }
function qrDetail(code, it){
  const x = it.x, e = it.e!=null ? t("qr_x_est",{e:nf(it.e)+" "+qrUnit(it)}) : "";
  if (code==="negative") return e;
  if (code==="spike") return t("qr_x_spike",{x:nf(x)}) + (e ? " · "+e : "");
  if (code==="duplicate") return x==="same" ? t("qr_x_same") : t("qr_x_diff",{v:x});
  if (code==="missing") return t(x==="marked" ? "qr_x_marked" : "qr_x_no_row");
  if (code==="spike") return t("qr_x_spike",{x:nf(x)});
  if (code==="conversion") return t("qr_x_conv",{x:nf(x)});
  if (code==="submeter") return t("qr_x_sub",{x:nf(x)});
  if (code==="out_of_window") return t("qr_x_window",{x});
  if (code==="bad_month") return x==="period" ? t("qr_x_period") : t("qr_x_format",{x});
  return x==null ? "" : String(x);
}
function renderQuality(){
  const Q = D.quality, R = Q.reimport.second;
  const rw = (n) => t(n===1 ? "qr_row" : "qr_rows");
  const k = [
    [t("qr_k_read"), nf(Q.read.mesures), rw(Q.read.mesures), t("qr_k_read_sub",{b:Q.read.batiments,c:Q.read.compteurs,i:Q.read.installations})],
    [t("qr_k_loaded"), nf(Q.loaded), rw(Q.loaded), t("qr_k_loaded_sub")],
    [t("qr_k_rejected"), nf(Q.rejected), rw(Q.rejected), t("qr_k_rejected_sub")],
    [t("qr_k_flagged"), nf(Q.flagged + Q.excluded), t("qr_points"), t("qr_k_flagged_sub",{e:Q.excluded})],
    [t("qr_k_reimport"), "+"+nf(R.added), rw(R.added), t("qr_k_reimport_sub",{s:nf(R.same),c:R.conflicts})],
  ];
  const KI = ["file-input","database","circle-x","flag","repeat-2"];
  document.getElementById("qr-kpis").innerHTML = k.map(([l,v,u,d],i)=>`<div class="card kpi"><div class="lab">${ic(KI[i])}${esc(l)}</div><div class="val">${v}<small>${esc(u)}</small></div><div class="delta mut">${esc(d)}</div></div>`).join("");
  document.getElementById("qr-list").innerHTML = Q.checks.map(c=>{
    const pill = !c.n ? `<span class="pill p-ren">${esc(t("qr_ok"))}</span>` : c.kind==="rejected" ? `<span class="pill p-fossil">${esc(t("qr_rej"))}</span>` : c.kind==="excluded" ? `<span class="pill p-fossil">${esc(t("qr_excl"))}</span>` : `<span class="pill p-warn">${esc(t("qr_flag"))}</span>`;
    const rows = c.items.map(it=>`<tr ${it.s && D.meters[it.s] ? `data-id="${esc(it.s)}"` : ""}><td>${esc(it.m||"")}</td><td>${esc(qrMonth(it.mo))}</td><td class="num">${it.v==null?"–":nf(it.v)+" "+esc(qrUnit(it))}</td><td>${esc(qrDetail(c.code,it))}</td></tr>`).join("");
    const more = c.n > c.items.length ? `<p class="sub">${esc(t("qr_more",{n:c.n-c.items.length}))}</p>` : "";
    const table = c.n ? `<div class="tablewrap"><table><thead><tr><th>${esc(t("qr_h_meter"))}</th><th>${esc(t("qr_h_month"))}</th><th class="num">${esc(t("qr_h_value"))}</th><th>${esc(t("qr_h_detail"))}</th></tr></thead><tbody>${rows}</tbody></table></div>${more}` : "";
    return `<details class="qc"><summary>${pill}<b>${esc(t("qc_"+c.code))}</b><span class="n">${c.n}</span></summary><p class="d">${esc(t("qd_"+c.code))}</p>${table}</details>`;
  }).join("");
}
function qualityCsv(){
  const rows = [["controle","statut","compteur","site","mois","valeur","detail"]];
  for (const c of D.quality.checks) for (const it of c.items) rows.push([t("qc_"+c.code), t(c.kind==="rejected"?"qr_rej":c.kind==="excluded"?"qr_excl":"qr_flag"), it.m||"", it.s||"", it.mo||"", it.v??"", qrDetail(c.code,it).replaceAll(";",",")]);
  const blob = new Blob(["﻿"+rows.map(r=>r.join(";")).join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "rive-claire-qualite.csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function renderAbout(){
  document.getElementById("flow").innerHTML = [1,2,3,4].map(i=>`<div class="step"><b>${esc(t("fl"+i))}</b><span>${esc(t("fl"+i+"s"))}</span></div>`).join("");
  document.getElementById("a-why").innerHTML = t("why").map(x=>`<li>${esc(x)}</li>`).join("");
  document.getElementById("a-ge").innerHTML = t("ge").map(x=>`<li>${esc(x)}</li>`).join("");
  document.getElementById("a-model").innerHTML = `<thead><tr><th>${esc(t("mh_field"))}</th><th>${esc(t("mh_what"))}</th></tr></thead><tbody>` + t("model").map(([f,w])=>`<tr style="cursor:default"><td><code>${esc(f)}</code></td><td>${esc(w)}</td></tr>`).join("") + `</tbody>`;
  document.getElementById("roadmap").innerHTML = t("road").map(([a,b])=>`<div class="card"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("");
}

/* ---------------------------------------------------------------- 3D map (loaded on first visit) */
let MAP = null, MAP_LOADING = false;
const isDark = () => { const a = document.documentElement.dataset.theme; return a ? a === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
const MAPS = {rc:{key:"rc", dir:"map-rc/"}, ge:{key:"ge", dir:"map/"}};
let MAPKEY = "rc";
try { if (MAPS[localStorage.getItem("energiack-map")]) MAPKEY = localStorage.getItem("energiack-map"); } catch(e) {}
function switchMap(k){
  if (MAP_LOADING || !MAPS[k] || k===MAPKEY) return;
  MAPKEY = k; try { localStorage.setItem("energiack-map", k); } catch(e) {}
  if (MAP) { MAP.destroy(); MAP = null; }
  renderMap();
}
function renderMap(){
  if (MAP || MAP_LOADING) return;
  MAP_LOADING = true;
  import("./map3d.js?v="+V).then(m => m.initMap(document.getElementById("m3"), {t, nf, esc, showTip, hideTip, dark:isDark, lang:()=>LANG, switchMap}, MAPS[MAPKEY]))
    .then(x => { MAP = x; MAP_LOADING = false; }).catch(e => { MAP_LOADING = false; document.getElementById("m3").innerHTML = `<div class="m3-loading">${esc(String(e))}</div>`; });
}

/* ---------------------------------------------------------------- site drawer */
let FLUID = "heat";
const MC = {EL:["Électricité, soutirage","Electricity, grid draw"], "EL-INJ":["Électricité, injection","Electricity, feed-in"], PV:["Production solaire","Solar production"],
  GZ:["Gaz naturel","Natural gas"], CAD:["Chaleur à distance","District heat"], MZ:["Mazout (livraisons)","Heating oil (deliveries)"], GR:["Granulés (livraisons)","Wood pellets (deliveries)"],
  PAC:["Électricité pompe à chaleur","Heat-pump electricity"], "CH-PAC":["Chaleur produite par la PAC","Heat-pump heat output"], "EL-VENT":["Électricité ventilation","Ventilation electricity"],
  "EL-FROID":["Électricité froid (glace)","Cooling electricity (ice)"], "EL-BORNES":["Bornes de recharge","EV chargers"], "EL-EAUBASSIN":["Électricité eau du bassin","Pool water electricity"], EAU:["Eau","Water"]};
const mcode = (id) => id.split("-").slice(1).join("-");
const mlabel = (m) => LANG==="fr" ? m.label : (MC[mcode(m.id)]||[m.label,m.label])[1];
const unitOf = (u) => u==="m3" ? "m³" : u;
const LV = {"général":"main", "sous-compteur":"sub-meter", "livraison":"deliveries", "production":"production", "mesure de chaleur":"heat metering"};
const lvl = (l) => LANG==="en" && LV[l] || l;
const loc = (x) => x == null ? "" : typeof x === "object" ? x[LANG] : x;
function siteCsv(id){
  const rows = [["mois","id_compteur","valeur","unite","energie_kwh","qualite"]];
  for (const m of D.meters[id]||[]) for (let i=0;i<D.meta.months;i++){
    const q = m.q[i], v = m.v[i];
    if (v==null && !q) continue;
    const ym = `${2021+Math.floor(i/12)}-${String(i%12+1).padStart(2,"0")}`;
    rows.push([ym, m.id, v??"", m.unit, m.kwh[i]??"", q ? t("q_"+q) : t("q_ok")]);
  }
  const blob = new Blob(["﻿"+rows.map(r=>r.join(";")).join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `rive-claire-${id}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function openSite(id){
  const s = D.sites.find(x=>x.id===id); if (!s) return;
  const S = D.series[s.id], cur = M.sites[s.id][YEAR], MS = D.meters[s.id] || [], a0 = (YEAR-2021)*12;
  const fluids = ["heat","elec_grid"].concat(S.pv_prod?["pv_prod"]:[]).concat(["water","co2"]);
  if (!fluids.includes(FLUID) && !(FLUID.startsWith("m:") && MS.some(m=>"m:"+m.id===FLUID))) FLUID = "heat";
  const hist = D.heating_history[s.id].map(h=>`${h.from_month?monthYear(h.from_month)+" → ":""}${t("car_"+h.carrier)}`).join(" · ");
  const ev = D.events.filter(e=>e.site===s.id);
  const homes = s.buildings.reduce((x,b)=>x+(b.homes||0),0), reno = Math.max(0,...s.buildings.map(b=>b.renovated||0));
  let onsite = "";
  if (S.pv_prod){
    const sum = (k)=>S[k].slice(a0,a0+12).reduce((x,y)=>x+y,0);
    const g = sum("elec_grid"), p = sum("pv_prod"), i = sum("pv_inject");
    onsite = `<div class="card" style="margin-top:14px"><h2>${esc(t("d_onsite",{y:YEAR}))}</h2><p class="sub">${esc(t("d_onsite_eq"))}</p>
      <div class="eq">${nf(g)} + ${nf(p)} − ${nf(i)} = <b>${nf(g+p-i)} kWh</b></div></div>`;
  }
  const flags = (m) => { const c = {}; for (const [i,q] of Object.entries(m.q)) if (Math.floor(i/12)===YEAR-2021) c[q]=(c[q]||0)+1;
    return Object.entries(c).map(([q,n])=>`<span class="pill p-warn">${esc(t("q_"+q))}${n>1?" ×"+n:""}</span>`).join(" "); };
  const total = (m) => { const v = m.v.slice(a0,a0+12).filter(x=>x!=null); return v.length ? nf(v.reduce((x,y)=>x+y,0)) : "–"; };
  const deliv = MS.some(m=>["MZ","GR"].includes(mcode(m.id)));
  const tbl = (head, rows) => `<div class="tablewrap"><table class="dtab"><thead><tr>${head.map(([h,c])=>`<th class="${c||""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  document.getElementById("drawer-in").innerHTML = `
    <div class="row"><div><div class="tsub">${esc(t("type_"+s.type))} · ${esc(s.id)} · ${esc(s.quarter)}</div><h1 style="margin:2px 0 0">${esc(s.name[LANG])}</h1></div><div class="spacer"></div>${VIEW==="carte"?`<button class="chip" id="dback">${esc(t("d_back_map"))}</button>`:""}<button class="x" id="dx" aria-label="close">×</button></div>
    <div class="facts">
      <div class="fact"><div class="lab">${esc(t("d_area"))}</div><div class="v">${s.area_m2?nf(s.area_m2)+" m²":esc(t("d_na"))}</div></div>
      <div class="fact"><div class="lab">${esc(t("d_built"))}</div><div class="v">${s.year_built??"–"}${reno?` <small class="mut">· ${reno}</small>`:""}</div></div>
      <div class="fact"><div class="lab">${esc(t("d_int",{y:YEAR}))}</div><div class="v">${cur.int==null?esc(t("d_na")):nf(cur.int)+" kWh/m²"}</div></div>
      <div class="fact"><div class="lab">${esc(t("d_pv"))}</div><div class="v">${s.pv_kwp?nf(s.pv_kwp)+(LANG==="fr"?" kWc":" kWp"):"–"}</div></div>
    </div>
    <div class="card"><div class="row" style="margin-bottom:8px"><h2>${esc(FLUID.startsWith("m:")?FLUID.slice(2)+" · "+mlabel(MS.find(m=>"m:"+m.id===FLUID)):t("d_series"))}</h2><div class="spacer"></div>
      <div class="chips">${fluids.map(f=>`<button class="chip ${f===FLUID?'on':''}" data-fl="${f}">${esc(t("fl_"+f))}</button>`).join("")}</div></div>
      <div id="ch-site"></div>
      <p class="sub" style="margin:8px 0 0">${esc(t("d_history"))}${esc(t("colon"))}${esc(hist)}</p>
      ${deliv?`<p class="sub" style="margin:4px 0 0">${esc(t("d_deliv"))}</p>`:""}
    </div>
    ${onsite}
    <div class="card" style="margin-top:14px"><div class="row" style="margin-bottom:6px"><div><h2>${esc(t("d_meters",{n:MS.length}))}</h2><p class="sub" style="margin:0">${esc(t("d_meters_sub",{y:YEAR}))}</p></div><div class="spacer"></div><button class="chip" id="dcsv">${esc(t("d_csv"))}</button></div>
      ${tbl([[t("h_meter")],[t("h_unit"),"hide-m"],[t("h_level"),"hide-m"],[t("h_total",{y:YEAR}),"num"],[t("h_flags")]],
        MS.map(m=>`<tr data-mt="${esc(m.id)}" class="${"m:"+m.id===FLUID?"sel":""}"><td><div class="tname">${esc(m.id)}</div><div class="tsub">${esc(mlabel(m))}</div></td><td class="hide-m">${esc(unitOf(m.unit))}</td><td class="hide-m">${esc(lvl(m.level))}${m.parent?` <span class="mut">⊂ ${esc(m.parent)}</span>`:""}</td><td class="num">${total(m)}</td><td>${flags(m)}</td></tr>`))}
    </div>
    <div class="card" style="margin-top:14px"><h2 style="margin-bottom:8px">${esc(t("d_buildings"))}</h2>
      ${tbl([[t("h_bname")],[t("h_built"),"num"],[t("h_reno"),"num hide-m"],["SRE m²","num"],[t("h_levels"),"num hide-m"],[t("h_label"),"hide-m"]],
        s.buildings.map(b=>`<tr><td><div class="tname">${esc(b.name)}</div>${b.homes?`<div class="tsub">${nf(b.homes)} ${esc(t("h_homes").toLowerCase())}</div>`:""}${b.note?`<div class="tsub">${esc(loc(b.note))}</div>`:""}</td><td class="num">${b.built??"–"}</td><td class="num hide-m">${b.renovated??"–"}</td><td class="num">${b.sre_m2?nf(b.sre_m2):"–"}</td><td class="num hide-m">${b.levels??"–"}</td><td class="hide-m">${esc(b.label||"–")}</td></tr>`))}
    </div>
    ${s.installations.length?`<div class="card" style="margin-top:14px"><h2 style="margin-bottom:8px">${esc(t("d_inst"))}</h2>
      ${tbl([[t("h_inst")],[t("h_power"),"num"],[t("h_from"),"num"],[t("h_to"),"num"]],
        s.installations.map(x=>`<tr class="${x.to?"mut":""}"><td><div class="tname">${esc(loc(x.label))}</div>${x.note?`<div class="tsub">${esc(loc(x.note))}</div>`:""}</td><td class="num">${x.kw?nf(x.kw)+(x.type==="pv"?(LANG==="fr"?" kWc":" kWp"):" kW"):"–"}</td><td class="num">${esc(x.from||"–")}</td><td class="num">${esc(x.to||"–")}</td></tr>`))}
    </div>`:""}
    <div class="card" style="margin-top:14px"><h2 style="margin-bottom:8px">${esc(t("d_events"))}</h2>
      ${ev.length?`<ul class="timeline">${ev.map(e=>`<li><span class="d">${esc(monthYear(e.month))}</span><span>${e.kind==="anomaly"||e.kind==="quality"?`<span class="pill p-warn">${ic("triangle-alert")}</span> `:''}${esc(e.text[LANG])}</span></li>`).join("")}</ul>`:`<div class="mut">${esc(t("d_noevents"))}</div>`}
    </div>
    <p class="sub" style="margin-top:14px">${esc(D.meta.source)}</p>`;
  const labels = Array.from({length:60},(_,i)=>i%12===0?String(2021+i/12):"");
  let values, unit, color, name;
  if (FLUID.startsWith("m:")) { const m = MS.find(x=>"m:"+x.id===FLUID); values = m.v; unit = " "+unitOf(m.unit); color = {"eau":"--water","électricité solaire":"--solar"}[m.fluid] || (m.fluid.startsWith("électricité")?"--elec":"--heat-fossil"); name = m.id; }
  else { values = S[FLUID]; unit = FLUID==="water" ? " m³" : FLUID==="co2" ? " kg" : " kWh"; color = {heat:"--heat-fossil", elec_grid:"--elec", pv_prod:"--solar", water:"--water", co2:"--muted"}[FLUID]; name = t("fl_"+FLUID); }
  lineChart(document.getElementById("ch-site"), labels, [{name, color, values}], v=>nf(v)+unit,
    {labelStep:1, h:220, tipLabel:i=>monthYear(i), ytick:v=>v>=10000?nf(v/1000)+"k":nf(v), markers:ev.map(e=>({i:e.month, color:e.kind==="anomaly"||e.kind==="quality"?"--warn":"--accent"}))});
  document.getElementById("dx").onclick = closeSite;
  const back = document.getElementById("dback"); if (back) back.onclick = closeSite;
  document.getElementById("dcsv").onclick = () => siteCsv(id);
  document.querySelectorAll("[data-fl]").forEach(b=>b.onclick=()=>{FLUID=b.dataset.fl; openSite(id);});
  document.querySelectorAll("[data-mt]").forEach(r=>r.onclick=()=>{FLUID="m:"+r.dataset.mt; openSite(id); document.getElementById("drawer").scrollTo({top:0, behavior:"smooth"});});
  document.getElementById("drawer").classList.add("open"); document.getElementById("scrim").classList.add("open");
  if (location.hash !== "#site/"+id) history.replaceState(null,"","#site/"+id);
}
function closeSite(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); if (location.hash.startsWith("#site/")) history.replaceState(null,"","#"+VIEW); }

/* ---------------------------------------------------------------- routing & events */
let VIEW = "accueil";
function route(){
  const h = location.hash.slice(1) || "accueil";
  if (h.startsWith("site/")) { if (VIEW !== "carte" && VIEW !== "qualite") VIEW = "gestion"; renderAll(); openSite(h.slice(5)); return; }
  VIEW = ["accueil","gestion","qualite","citoyens","carte","apropos"].includes(h) ? h : "accueil";
  closeSiteSilently(); renderAll();
}
function closeSiteSilently(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); }
function renderAll(){
  applyStatic();
  for (const v of ["accueil","gestion","qualite","citoyens","carte","apropos"]) document.getElementById("v-"+v).classList.toggle("hide", v!==VIEW);
  document.querySelector(".notice").textContent = t(VIEW==="carte" ? "notice_map" : "notice");
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.dataset.view===VIEW));
  document.getElementById("crumb").textContent = t(NAVKEY[VIEW]); side(false);
  if (VIEW==="accueil") renderWelcome(); else if (VIEW==="gestion") renderManager(); else if (VIEW==="qualite") renderQuality(); else if (VIEW==="citoyens") renderCitizen(); else if (VIEW==="carte") renderMap(); else renderAbout();
  if (MAP) { MAP.relabel(); MAP.theme(); }
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-lang],[data-y],[data-f],th[data-k],tbody tr[data-id]"); if (!el) return;
  if (el.dataset.lang){ LANG = el.dataset.lang; try{localStorage.setItem("edm-lang",LANG);}catch(e){} const open = document.getElementById("drawer").classList.contains("open"); renderAll(); if (open) openSite(location.hash.slice(6)); }
  else if (el.dataset.y){ YEAR = +el.dataset.y; renderManager(); }
  else if (el.dataset.f){ FILTER = el.dataset.f; renderTable(); }
  else if (el.dataset.k){ SORT = {k:el.dataset.k, dir: SORT.k===el.dataset.k ? -SORT.dir : (el.dataset.k==="name"||el.dataset.k==="c"?1:-1)}; renderTable(); }
  else if (el.dataset.id){ openSite(el.dataset.id); }
});
document.getElementById("qr-csv").onclick = qualityCsv;
const side = (open) => { document.getElementById("side").classList.toggle("open", open); document.getElementById("side-scrim").classList.toggle("open", open); };
document.getElementById("menu-btn").onclick = () => side(true);
document.getElementById("side-scrim").onclick = () => side(false);
document.getElementById("theme-btn").onclick = () => {
  const th = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = th; try{localStorage.setItem("edm-theme",th);}catch(e){}
  const open = document.getElementById("drawer").classList.contains("open"); renderAll(); if (open) openSite(location.hash.slice(6));
};
document.getElementById("q").addEventListener("input", e => { QUERY = e.target.value; renderTable(); });
document.getElementById("scrim").onclick = closeSite;
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSite(); });
window.addEventListener("hashchange", route);
let RZ, LASTW = innerWidth;
window.addEventListener("resize", () => { clearTimeout(RZ); RZ = setTimeout(() => { if (Math.abs(innerWidth - LASTW) < 40 || !D) return; LASTW = innerWidth; const open = document.getElementById("drawer").classList.contains("open"); renderAll(); if (open) openSite(location.hash.slice(6)); }, 200); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", renderAll);

const V = "14";
fetch("data.json?v="+V).then(r=>r.json()).then(d => { D = d; compute(); route(); });
</script>
